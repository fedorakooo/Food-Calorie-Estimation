[project]
name = "food-calorie-estimation"
version = "0.1.0"
description = "Probabilistic calorie estimation from food images."
authors = [{ name = "Aliaksandr Fedaraka", email = "fedorakooo@gmail.com" }]
requires-python = ">=3.12,<4.0"
dependencies = [
    "numpy>=2.1,<3",
    "pandas>=2.2,<3",
    "pillow>=10.4,<12",
    "pyarrow>=18,<24",
    "pydantic>=2.10,<3",
    "pyyaml>=6.0,<7",
    "xlrd>=2.0,<3",
]

[project.scripts]
food-calorie = "food_calorie_estimation.cli:main"

[tool.poetry]
packages = [{ include = "food_calorie_estimation", from = "src" }]

[tool.poetry.group.dev.dependencies]
pre-commit = "^4.2.0"
black = "25.1.0"
mypy = "^1.15.0"
pandas-stubs = ">=2.2,<3"
ruff = "^0.12.7"
pytest = "^8.3.0"
types-pyyaml = ">=6.0,<7"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra"]

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["src", "tests"]
fix = true

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]

[tool.black]
line-length = 120
target-version = ["py312"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
